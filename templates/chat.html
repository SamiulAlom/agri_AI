<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এগ্রি বট - আপনার কৃষি বন্ধু</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        .chat-container {
            height: calc(100vh - 160px);
        }
        .user-bubble {
            background-color: #10b981;
            color: white;
            border-radius: 20px 20px 0px 20px;
        }
        .bot-bubble {
            background-color: #f3f4f6;
            color: #1f2937;
            border-radius: 20px 20px 20px 0px;
            border: 1px solid #e5e7eb;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-green-600 hover:text-green-800 transition">
                <i class="fas fa-arrow-left mr-2"></i> ফিরে যান
            </a>
            <div class="flex items-center">
                <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mr-3">
                    <i class="fas fa-robot text-green-600"></i>
                </div>
                <div>
                    <h1 class="font-bold text-gray-800 leading-tight">এগ্রি বট (Agri Bot)</h1>
                    <span class="text-xs text-green-500 flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse mr-1"></span> অনলাইন
                    </span>
                </div>
            </div>
            <button onclick="clearChat()" class="text-red-500 hover:text-red-700 text-sm font-medium">
                <i class="fas fa-trash-alt mr-1"></i> চ্যাট মুছুন
            </button>
        </div>
    </header>

    <main class="container mx-auto max-w-3xl p-4 chat-container overflow-y-auto" id="chat-window">
        <div id="messages" class="space-y-4">
            <div class="flex justify-start">
                <div class="bot-bubble p-4 max-w-[80%] shadow-sm">
                    আসসালামু আলাইকুম! আমি আপনার কৃষি সহায়ক বট। ধান চাষ, সার প্রয়োগ বা ফসলের রোগ নিয়ে আপনার কি কোনো প্রশ্ন আছে?
                </div>
            </div>
        </div>
        <div id="loading" class="hidden flex justify-start mt-4">
            <div class="bot-bubble p-4 shadow-sm flex items-center">
                <div class="flex space-x-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-.3s]"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-.5s]"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t p-4 fixed bottom-0 w-full">
        <div class="container mx-auto max-w-3xl">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="user-input" 
                       class="flex-1 border border-gray-300 rounded-full px-6 py-3 focus:outline-none focus:border-green-500 shadow-sm" 
                       placeholder="আপনার প্রশ্নটি এখানে লিখুন..." required>
                <button type="submit" class="bg-green-600 text-white w-12 h-12 rounded-full flex items-center justify-center hover:bg-green-700 transition shadow-md">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
